<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            padding: 40px;
        }
        form {
            max-width: 420px;
            margin: 0 auto;
            background: #1c1c1c;
            padding: 24px;
            border-radius: 10px;
        }
        input {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        .message {
            margin-top: 12px;
            color: #aaffaa;
        }
        a {
            color: #5dade2;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <form id="registerForm">
        <h2>Create account</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="number" id="balance" placeholder="Balance" value="500" step="0.01">
        <button type="submit">Register</button>
        <p>Already have an account? <a href="/login">Login</a></p>
        <div id="message" class="message"></div>
    </form>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const payload = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                balance: Number(document.getElementById('balance').value || 0)
            };

            fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                const msg = document.getElementById('message');
                if (data.error) {
                    msg.textContent = 'Error: ' + data.error;
                    msg.style.color = '#ffcccc';
                } else {
                    msg.textContent = 'User created successfully! Redirecting to login...';
                    msg.style.color = '#aaffaa';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 700);
                }
            })
            .catch(err => {
                document.getElementById('message').textContent = 'Request failed';
            });
        });
    </script>
</body>
</html>
